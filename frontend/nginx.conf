server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every non-file route serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
