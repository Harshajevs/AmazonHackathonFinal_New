services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/firetv.db
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-please-32chars}
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      MOOD_PROVIDER: heuristic
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
